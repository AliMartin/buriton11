# Local upgrade storage must never be served directly by nginx.
# Application-managed /system/files downloads still use Drupal access checks.
location = /private-files { deny all; }
location ^~ /private-files/ { deny all; }
location = /database { deny all; }
location ^~ /database/ { deny all; }
location = /tmp { deny all; }
location ^~ /tmp/ { deny all; }
